仓库 1：api-auto-test（自动化测试代码）

api-auto-test/
├── config/
│   ├── __init__.py
│   └── config.py              # 环境配置（URL、账号、接口路径）
├── common/
│   ├── __init__.py
│   └── api_client.py          # 封装登录、重试、请求等公共方法
├── testcases/
│   ├── __init__.py
│   ├── test_demo.py           # 单元测试（3 条）
│   ├── test_login.py          # 登录接口测试（7 条）
│   ├── test_user.py           # 用户管理接口测试（10 条）
│   ├── test_dialogue.py       # 对话接口测试（10 条）
│   └── test_regression.py     # 业务流程回归测试（4 条）
├── Jenkinsfile                # CI/CD Pipeline 配置
├── pytest.ini                 # pytest marker 配置
├── requirements.txt           # 依赖包
├── .gitignore                 # 忽略规则
└── README.md                  # 项目说明
具体改动
面试怎么说
> "我们项目的自动化测试流程是这样的：
>
> 代码放在 GitHub 仓库，用 pytest + requests 写接口自动化用例。Jenkins 通过 Pipeline 方式管理，Jenkinsfile 放在项目根目录，定义了拉取代码、安装依赖、单元测试、接口测试、回归测试这几个阶段。
>
> 触发方式主要是 SCM 轮询 + 手动触发，每次构建会自动执行全部测试用例，单元测试还会统计代码覆盖率。
>
> 项目结构是按 config/、common/、testcases/ 分层的，配置和公共方法统一管理，测试用例按模块划分，回归测试用 pytest.mark 按业务线分组，可以选择性执行。"
这段话涵盖了：工具链、流程、触发方式、覆盖率、项目结构、分层设计，面试官会觉得你是真正做过的。