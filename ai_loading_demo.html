<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Loading 动效概念演示</title>
    <style>
        body {
            background-color: #121212;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h1 { margin-bottom: 40px; font-weight: 300; letter-spacing: 2px; }
        .container {
            display: flex;
            gap: 60px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .card {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 200px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.3s;
        }
        .card:hover { transform: translateY(-5px); }
        .card h3 { margin-top: 20px; font-size: 16px; color: #aaa; }
        
        /* 1. 神经脉冲 (Neural Pulse) */
        .loader-1 {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            position: relative;
            animation: pulse-glow 2s infinite ease-in-out;
            box-shadow: 0 0 20px rgba(79, 172, 254, 0.6);
        }
        .loader-1::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80%; height: 80%;
            background: #121212;
            border-radius: 50%;
            z-index: 1;
        }
        .loader-1::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            filter: blur(10px);
            opacity: 0.6;
            animation: pulse-blur 2s infinite ease-in-out;
            z-index: 0;
        }

        @keyframes pulse-glow {
            0% { transform: scale(0.95); box-shadow: 0 0 15px rgba(79, 172, 254, 0.4); }
            50% { transform: scale(1.1); box-shadow: 0 0 30px rgba(79, 172, 254, 0.8); }
            100% { transform: scale(0.95); box-shadow: 0 0 15px rgba(79, 172, 254, 0.4); }
        }

        /* 2. 量子轨道 (Quantum Orbit) */
        .loader-2 {
            width: 60px;
            height: 60px;
            position: relative;
        }
        .atom-core {
            width: 16px;
            height: 16px;
            background: #8e2de2;
            border-radius: 50%;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px #8e2de2;
            animation: core-pulse 1.5s infinite alternate;
        }
        .orbit {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border-radius: 50%;
            border: 2px solid rgba(142, 45, 226, 0.3);
            border-top: 2px solid #8e2de2;
            border-bottom: 2px solid #4a00e0;
            box-sizing: border-box;
        }
        .orbit:nth-child(1) { animation: spin 2s linear infinite; }
        .orbit:nth-child(2) { width: 70%; height: 70%; top: 15%; left: 15%; animation: spin-reverse 1.5s linear infinite; border-color: rgba(0, 242, 254, 0.3); border-left: 2px solid #00f2fe; border-right: 2px solid #00f2fe; border-top: none; border-bottom: none;}
        
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes spin-reverse { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }
        @keyframes core-pulse { 0% { opacity: 0.7; transform: translate(-50%, -50%) scale(0.9); } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } }

        /* 3. 数据波形 (Data Wave) */
        .loader-3 {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 50px;
            height: 40px;
        }
        .bar {
            width: 6px;
            height: 100%;
            background: #ff0099;
            border-radius: 3px;
            animation: wave 1s ease-in-out infinite;
        }
        .bar:nth-child(1) { animation-delay: 0.0s; background: #493240; }
        .bar:nth-child(2) { animation-delay: 0.1s; background: #ff0099; }
        .bar:nth-child(3) { animation-delay: 0.2s; background: #f64f59; }
        .bar:nth-child(4) { animation-delay: 0.3s; background: #c471ed; }
        .bar:nth-child(5) { animation-delay: 0.4s; background: #12c2e9; }

        @keyframes wave {
            0%, 100% { height: 20%; }
            50% { height: 80%; }
        }
    </style>
</head>
<body>
    <h1>AI 回答加载动效演示</h1>
    
    <div class="container">
        <!-- 方案 1 -->
        <div class="card">
            <div class="loader-1"></div>
            <h3>神经脉冲 (Neural Pulse)</h3>
        </div>

        <!-- 方案 2 -->
        <div class="card">
            <div class="loader-2">
                <div class="orbit"></div>
                <div class="orbit"></div>
                <div class="atom-core"></div>
            </div>
            <h3>量子轨道 (Quantum Orbit)</h3>
        </div>

        <!-- 方案 3 -->
        <div class="card">
            <div class="loader-3">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
            <h3>数据波形 (Data Wave)</h3>
        </div>
    </div>
</body>
</html>
